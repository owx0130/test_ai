[project]
name = "meeting-deconflictor"
version = "0.1.0"
description = "Paste what everyone said about their week, get one meeting slot that collides with nothing."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.60",
    "jinja2>=3.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_deconflictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
